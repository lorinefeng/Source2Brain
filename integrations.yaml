schema_version: 1
verified_on: '2026-09-29'
scope: phase-1-openclaw-weixin-reference-deployment
required_semantics: required 只描述本次参考部署，不表示母项目要求所有用户安装
extension_catalog: references/extensions/catalog.yaml
host_guides: references/hosts/README.md
additional_host_validation:
  date: '2026-10-01'
  host: Hermes Agent
  repo: https://github.com/NousResearch/hermes-agent
  cli_version: '0.21.0'
  checkout: '97f3229dfd'
  license: MIT
  scope: Skill 发现、已有知识跨宿主文件检索、合成材料保存与重复保护
  retrieval: file_keyword
  report: docs/hermes-validation.md
integrations:
  - id: openclaw
    repo: https://github.com/openclaw/openclaw
    role: Agent 运行时与内置 memory-core
    required: true
    tested_version: '2026.9.6'
    license: MIT
  - id: openclaw-weixin
    repo: https://github.com/Tencent/openclaw-weixin
    role: 微信输入与回复通道
    required: true
    tested_version: '2.4.9'
    license: MIT
  - id: agent-reach
    repo: https://github.com/Panniantong/Agent-Reach
    role: 互联网能力发现和采集路由
    required: true
    tested_version: '1.5.0'
    license: MIT
    notes: 两台机器同版本的 doctor 行为不同，必须以真实命令进一步探测
  - id: opencli
    repo: https://github.com/jackwener/opencli
    role: 复用用户浏览器登录态读取小红书
    required: true
    tested_version: '1.8.6'
    license: Apache-2.0
  - id: funasr
    repo: https://github.com/modelscope/FunASR
    role: 本次部署的本地语音转写实现
    required: false
    required_for: 无字幕视频必须配置可用的 ASR 实现
    tested_version: '1.4.16'
    license: MIT
    model_license: Apache-2.0
    models: [speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch, speech_fsmn_vad_zh-cn-16k-common-pytorch, punc_ct-transformer_cn-en-common-vocab471067-large]
  - id: llama-cpp-provider
    repo: https://github.com/openclaw/openclaw
    role: 本次部署的本地语义 embedding 实现
    required: false
    required_for: 语义召回必须配置可用的 embedding 实现
    tested_version: '2026.9.6'
    runtime_build: b10809-5266f24da
    license: MIT
    model: ggml-org/embeddinggemma-300m-qat-q8_0-GGUF
    model_license: 上游 Gemma 条款，模型权重不随本项目分发
optional_future:
  - {id: markitdown, repo: 'https://github.com/microsoft/markitdown', role: 文档扩展, installed_by_this_project: false}
  - {id: karakeep, repo: 'https://github.com/karakeep-app/karakeep', role: 收藏箱扩展, installed_by_this_project: false}
verified_optional_packs:
  - id: media
    install_by_default: false
    tested_platform: macOS-arm64
    recipe: references/extensions/media.md
    projects:
      - {id: summarize, repo: 'https://github.com/steipete/summarize', tested_version: '0.24.0', license: MIT, role: 本地视频关键帧与时间戳}
      - {id: tesseract-js, repo: 'https://github.com/naptha/tesseract.js', tested_version: '7.0.0', license: Apache-2.0, role: 本地中英文 OCR}
